// ── SERVER CALL WRAPPERS (google.script.run) ──────────────────────────────────
function callServer(fnName, args, onSuccess, onFailure) {
  let call = google.script.run;
  // New terms to accept (e.g. a new version while signed in): show the terms page instead
  if (onSuccess) call = call.withSuccessHandler(res => {
    if (res && res.termsRequired && typeof showTermsAgain === 'function') return showTermsAgain();
    onSuccess(res);
  });
  if (onFailure) call = call.withFailureHandler(onFailure);
  call[fnName].apply(call, args);
}
