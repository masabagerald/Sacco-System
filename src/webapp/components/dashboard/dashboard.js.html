<script>
// ── ADMIN DASHBOARD ───────────────────────────────────────────────────────────
function loadAdmin(){
  Api.getAdminDashboard(res=>{
    if(!res.ok)return;
    $('#d_mem').textContent=res.totalMembers;$('#d_sav').textContent=fmt(res.totalSavings);
    $('#d_out').textContent=fmt(res.totalLoansOutstanding);$('#d_lc').textContent=res.activeLoanCount+' active';
    $('#d_fin').textContent=fmt(res.unpaidFinesTotal);$('#d_plr').textContent=res.pendingLoanRequests;
    $('#d_pwr').textContent=res.pendingWithdrawalRequests;
    setBadge('rb-loans',res.pendingLoanRequests);setBadge('rb-wd',res.pendingWithdrawalRequests);
    $('#d_dep').textContent=fmt(res.depositsThisMonth);$('#d_wdm').textContent=fmt(res.withdrawalsThisMonth);
    $('#d_rep').textContent=fmt(res.repaymentsThisMonth);
    $('#d_li').textContent=res.loansIssuedThisMonth;$('#d_lia').textContent=fmt(res.loansIssuedAmountThisMonth);
    $('#d_od').textContent=res.overdueCount;$('#d_oda').textContent=fmt(res.overdueAmount);
    const items=c=>c+' item'+(c===1?'':'s');
    $('#d_finMeta').textContent=items(res.unpaidSurchargeCount)+' open';
    $('#d_ps').textContent=fmt(res.paidFinesTotal);$('#d_psMeta').textContent=items(res.paidSurchargeCount)+' settled, all time';
    $('#d_catSub').textContent='Month of '+res.month+'. Deposits saved before categories existed show as Uncategorised.';
    const tot=res.categoryTotals.reduce((s,c)=>s+c.amount,0);
    $('#d_catTb').innerHTML=res.categoryTotals.map(c=>'<tr><td>'+esc(c.category)+'</td><td class="r">'+Math.round(c.amount).toLocaleString('en-US')+'</td></tr>').join('')
      +'<tr><td><strong>Total</strong></td><td class="r"><strong>'+Math.round(tot).toLocaleString('en-US')+'</strong></td></tr>';
    DEP_ACCS=res.depositAccounts||[];renderAccTab();
    const ot=$('#overdueTb');
    ot.innerHTML=res.overdueLoans.length?res.overdueLoans.map(l=>'<tr><td>'+esc(l.loanId)+'</td><td>'+esc(l.memberName)+'</td><td class="r">'+Math.round(l.outstandingBalance).toLocaleString('en-US')+'</td><td>'+esc(l.progressLabel)+'</td></tr>').join(''):'<tr class="empty"><td colspan="4">None &mdash; all good.</td></tr>';
  });
  loadMembers(); loadActiveLoansAdmin(); loadRepaymentsAdmin(); loadLoanReqAdmin(); loadWdReqAdmin(); loadFinesAdmin();
}

// ── DEPOSIT ACCOUNT TABS (Principal / Operations / Welfare) ───────────────────
let DEP_ACCS=[], ACC_TAB='Principal';
function showAccTab(a){ACC_TAB=a;renderAccTab();}
function renderAccTab(){
  document.querySelectorAll('#d_accTabs .tab').forEach(b=>b.classList.toggle('on',b.dataset.acc===ACC_TAB));
  const a=DEP_ACCS.find(x=>x.account===ACC_TAB); if(!a)return;
  const money=v=>Math.round(n(v)).toLocaleString('en-US');
  $('#d_accLbl').textContent='Total '+a.account+' contributions';
  $('#d_accContrib').textContent=fmt(a.contributions);
  $('#d_accMonth').textContent=fmt(a.contributionsThisMonth)+' this month';
  $('#d_accWd').textContent=fmt(a.withdrawals);
  $('#d_accInvC').classList.toggle('hidden',!a.pooled||!(a.invested||a.redeemed));
  $('#d_accInv').textContent=fmt(n(a.invested)-n(a.redeemed));
  $('#d_accInvM').textContent=a.redeemed?fmt(a.invested)+' invested, '+fmt(a.redeemed)+' redeemed back':'Paid into investments from this pool';
  $('#d_accBal').textContent=fmt(a.balance);
  $('#d_accBalTh').textContent=a.pooled?'Net':'Balance';
  $('#d_accNote').textContent=a.pooled
    ?a.account+' is a club pool: any Founder or Delegate Member may withdraw from it, up to the current balance, whatever they contributed. "Net" is a member\'s contributions less their withdrawals.'
    :'Principal is individual savings: each member can withdraw only their own balance.';
  $('#d_accTb').innerHTML=a.members.length
    ?a.members.map(m=>'<tr><td>'+esc(m.memberNo)+' — '+esc(m.name)+'</td><td class="r">'+money(m.contributions)+'</td><td class="r">'+money(m.withdrawals)+'</td><td class="r">'+money(m.balance)+'</td></tr>').join('')
      +'<tr><td><strong>Total</strong></td><td class="r"><strong>'+money(a.contributions)+'</strong></td><td class="r"><strong>'+money(a.withdrawals)+'</strong></td><td class="r"><strong>'+money(a.balance)+'</strong></td></tr>'
    :'<tr class="empty"><td colspan="4">No '+esc(a.account)+' contributions recorded yet.</td></tr>';
}

// ── AUDIT LOG ─────────────────────────────────────────────────────────────────
// Searched, filtered and paged on the server, so years of history stay quick to browse.
const AUDIT={filters:{},page:0,pageSize:100};
function readAuditFilters(){
  return {q:$('#auditQ').value.trim(),member:$('#auditMember').value,category:$('#auditCat').value,
    from:$('#auditFrom').value,to:$('#auditTo').value,sensitive:$('#auditSens').checked};
}
function searchAudit(){AUDIT.filters=readAuditFilters();AUDIT.page=0;loadAudit();}
function clearAuditFilters(){
  ['#auditQ','#auditMember','#auditCat','#auditFrom','#auditTo'].forEach(s=>$(s).value='');
  $('#auditSens').checked=false;searchAudit();
}
function auditPage(step){AUDIT.page=Math.max(0,AUDIT.page+step);loadAudit();}
// Fills a filter dropdown once, keeping the current choice; a value not in the list (e.g. "System") is added
function auditOptions(sel,items){
  const el=$(sel),cur=el.value;
  if(el.options.length<=1)items.forEach(o=>el.add(new Option(o.label,o.value)));
  if(cur&&![...el.options].some(o=>o.value===cur))el.add(new Option(cur,cur));
  el.value=cur;
}
const auditWho=(no,name)=>no?'<button class="au-link" data-member="'+esc(no)+'" title="Show this member\'s history">'+esc(no)+(name?' · '+esc(name):'')+'</button>':'';
function loadAudit(){
  const tb=$('#auditTb');
  tb.innerHTML='<tr class="empty"><td colspan="6">Loading&hellip;</td></tr>';
  document.querySelectorAll('.au-pager').forEach(p=>p.innerHTML='');
  Api.getAuditLog(Object.assign({page:AUDIT.page,pageSize:AUDIT.pageSize},AUDIT.filters),res=>{
    if(!res.ok){tb.innerHTML='<tr class="empty"><td colspan="6">'+esc(res.error)+'</td></tr>';return;}
    $('#auditTz').textContent=res.timeZone?'Times are '+res.timeZone+' time.':'';
    auditOptions('#auditMember',res.members.map(m=>({value:m.no,label:m.no+' · '+m.name})));
    auditOptions('#auditCat',res.categories.map(c=>({value:c,label:c})));
    if(!res.entries.length){tb.innerHTML='<tr class="empty"><td colspan="6">'+(res.total?'No more entries.':'No entries match these filters.')+'</td></tr>';}
    else{
      let day='';
      tb.innerHTML=res.entries.map(e=>{
        const d=String(e.timestamp).slice(0,10),t=String(e.timestamp).slice(11);
        const head=d!==day?'<tr class="au-day"><td colspan="6">'+esc(auditDay(d))+'</td></tr>':'';day=d;
        return head+'<tr'+(e.sensitive?' class="au-sens"':'')+'><td class="mono">'+esc(t||'—')+'</td>'
          +'<td><span class="au-cat au-'+esc(e.category.toLowerCase())+'">'+esc(e.category)+'</span> '+esc(e.action)
          +(e.sensitive?' <span class="badge rejected" title="Undoes, overrides or changes a record, or takes data out">Sensitive</span>':'')+'</td>'
          +'<td>'+auditWho(e.member,e.memberName)+'</td><td>'+auditWho(e.performedBy,e.performedByName)+'</td>'
          +'<td>'+esc(e.details)+'</td>'
          +'<td>'+(e.refId?'<button class="au-link mono" data-ref="'+esc(e.refId)+'" title="Show every entry with this reference">'+esc(e.refId)+'</button>':'')+'</td></tr>';
      }).join('');
    }
    const first=res.page*res.pageSize,last=first+res.entries.length;
    const pager=(res.total?'<span>Showing '+(first+1).toLocaleString()+'–'+last.toLocaleString()+' of '+res.total.toLocaleString()+' entries</span>':'<span></span>')
      +'<span class="btn-row"><button class="btn sm" onclick="auditPage(-1)"'+(res.page?'':' disabled')+'>&larr; Newer</button>'
      +'<button class="btn sm" onclick="auditPage(1)"'+(last<res.total?'':' disabled')+'>Older &rarr;</button></span>';
    document.querySelectorAll('.au-pager').forEach(p=>p.innerHTML=pager);
  },e=>{tb.innerHTML='<tr class="empty"><td colspan="6">Error: '+esc(e.message)+'</td></tr>';});
}
// "Tuesday, 14 March 2034" for the day headings
function auditDay(d){
  const m=String(d).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m?new Date(+m[1],+m[2]-1,+m[3]).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):d;
}
// Clicking a member shows their history; clicking a reference shows that record's whole trail
document.addEventListener('click',ev=>{
  const b=ev.target.closest&&ev.target.closest('#auditTb .au-link');if(!b)return;
  if(b.dataset.member){const sel=$('#auditMember');
    if(![...sel.options].some(o=>o.value===b.dataset.member))sel.add(new Option(b.dataset.member,b.dataset.member));
    sel.value=b.dataset.member;$('#auditQ').value='';}
  if(b.dataset.ref){$('#auditQ').value=b.dataset.ref;$('#auditMember').value='';}
  $('#auditCat').value='';$('#auditFrom').value='';$('#auditTo').value='';$('#auditSens').checked=false;
  searchAudit();
});
// Downloads everything matching the filters (also applied to the table, so the two match). The server
// sends the CSV in pages (20,000 entries each); they are joined here into one file.
function downloadAuditCsv(){
  const filters=readAuditFilters(),btn=$('#auditCsvBtn'),st=$('#auditCsvSt'),parts=[];
  if(JSON.stringify(filters)!==JSON.stringify(AUDIT.filters))searchAudit();
  const fail=msg=>{btn.disabled=false;st.textContent='Error: '+msg;};
  btn.disabled=true;st.textContent='Preparing…';
  const page=offset=>Api.exportAuditLogCsv(filters,offset,res=>{
    if(!res.ok)return fail(res.error);
    parts.push(res.csv);
    if(res.nextOffset!=null){st.textContent='Preparing… '+res.nextOffset.toLocaleString()+' of '+res.total.toLocaleString()+' entries';return page(res.nextOffset);}
    const url=URL.createObjectURL(new Blob([parts.join('\n')],{type:'text/csv;charset=utf-8;'})),a=document.createElement('a');
    a.href=url;a.download=res.fileName;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
    btn.disabled=false;st.textContent='Downloaded '+res.total.toLocaleString()+' entries.';
  },e=>fail(e.message));
  page(0);
}
</script>
