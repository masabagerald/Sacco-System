<div class="panel">
  <div class="ph">
    <div><h2>Audit Log</h2><p class="sub">Every action recorded automatically. Append-only &mdash; never edited by the system. <span id="auditTz"></span></p></div>
    <button class="btn sm" onclick="loadAudit()">Refresh</button>
  </div>
  <div class="bar">
    <span>Download:</span>
    <div class="field" style="margin:0"><label for="auditFrom">From</label><input id="auditFrom" type="date"></div>
    <div class="field" style="margin:0"><label for="auditTo">To</label><input id="auditTo" type="date"></div>
    <button class="btn sm solid" id="auditCsvBtn" onclick="downloadAuditCsv()">Download CSV</button>
    <span id="auditCsvSt">Leave the dates blank to download the whole log.</span>
  </div>
  <table><thead><tr><th>Date &amp; time</th><th>Action</th><th>Member</th><th>Performed By</th><th>Details</th><th>Ref</th></tr></thead>
  <tbody id="auditTb"><tr class="empty"><td colspan="6">Loading&hellip;</td></tr></tbody></table>
</div>
