<script>
// ── LOGIN FLOW ──────────────────────────────────────────────────────────────────
let DET_EMAIL='', OTP_EMAIL='';
function showOnly(id){
  ['s_loading','s_confirm','s_manual','s_otp','s_noreg','s_terms'].forEach(s=>$('#'+s).classList.toggle('hidden',s!==id));
}
window.addEventListener('load',()=>{
  Api.tryAutoDetect(res=>{
    if(res.detected&&res.email){DET_EMAIL=res.email;$('#detectedEmail').textContent=res.email;showOnly('s_confirm');}
    else showManual();
  }, ()=>showManual());
});
function doConfirm(){
  $('#confirmErr').textContent='';
  Api.confirmAutoDetect(DET_EMAIL, res=>{
    if(!res.ok){res.notRegistered?($('#noregMsg').textContent=res.error,showOnly('s_noreg')):($('#confirmErr').textContent=res.error);return;}
    ME=res.member;afterSignIn();
  }, e=>$('#confirmErr').textContent='Error: '+e.message);
}
function showManual(){$('#manualEmail')&&($('#manualEmail').value='');$('#manualErr').textContent='';showOnly('s_manual');setTimeout(()=>$('#manualEmail')?.focus(),80);}
function doSendOtp(){
  const email=$('#manualEmail').value.trim(),err=$('#manualErr');
  if(!email){err.textContent='Please enter your email address.';return;}
  $('#sendOtpBtn').disabled=true;err.textContent='';
  Api.sendOtp(email, res=>{
    $('#sendOtpBtn').disabled=false;
    if(!res.ok){res.notRegistered?($('#noregMsg').textContent=res.error,showOnly('s_noreg')):(err.textContent=res.error);return;}
    OTP_EMAIL=email;$('#otpMasked').textContent=res.maskedEmail;$('#otpCode').value='';$('#otpErr').textContent='';
    showOnly('s_otp');setTimeout(()=>$('#otpCode')?.focus(),80);
  }, e=>{$('#sendOtpBtn').disabled=false;err.textContent='Error: '+e.message;});
}
function doVerify(){
  const code=$('#otpCode').value.trim(),err=$('#otpErr');
  if(code.length<6){err.textContent='Please enter the 6-digit code.';return;}
  $('#verifyBtn').disabled=true;err.textContent='';
  Api.verifyOtp(OTP_EMAIL, code, res=>{
    $('#verifyBtn').disabled=false;
    if(!res.ok){if(res.expired){err.textContent=res.error;setTimeout(showManual,2000);}else err.textContent=res.error;return;}
    ME=res.member;afterSignIn();
  }, e=>{$('#verifyBtn').disabled=false;err.textContent='Error: '+e.message;});
}
// ── TERMS OF USE (after sign-in, until the current versions are accepted) ──────
// The server refuses every request until they are accepted; this screen is how they are accepted.
let TERMS=null;
function afterSignIn(){
  showOnly('s_loading');
  Api.getTermsStatus(res=>{
    if(!res.ok){showManual();$('#manualErr').textContent=res.error;return;}
    ME=res.member;
    if(!res.required)return enterApp();
    TERMS=res;renderTermsGate(res);showOnly('s_terms');
  },e=>{showManual();$('#manualErr').textContent='Error: '+e.message;});
}
// Called when the server refuses a request because new terms must be accepted (for example a new version)
function showTermsAgain(){
  if(!$('#s_terms').classList.contains('hidden'))return;
  $('#appView').classList.add('hidden');$('#loginView').classList.remove('hidden');afterSignIn();
}
function termsDocHtml(d,withBox){
  return '<div class="terms-doc"><h2>'+esc(d.title)+'</h2><p class="note">'+esc(d.appliesTo)+' · version '+esc(d.version)+', updated '+esc(hd(d.updated))
    +(d.acceptedAt?' · you accepted it on '+esc(hdt(d.acceptedAt)):'')+'</p>'
    +'<div class="terms-text"><p>'+esc(d.intro)+'</p>'+d.sections.map((s,i)=>'<h3>'+(i+1)+'. '+esc(s.heading)+'</h3><ul>'+s.points.map(p=>'<li>'+esc(p)+'</li>').join('')+'</ul>').join('')+'</div>'
    +(withBox?'<label class="terms-check"><input type="checkbox" data-doc="'+esc(d.key)+'" data-version="'+esc(d.version)+'" onchange="termsTicked()"> '+esc(d.checkbox)+'</label>':'')+'</div>';
}
function renderTermsGate(res){
  const pending=res.documents.filter(d=>!d.acceptedAt);
  $('#termsIntro').textContent='Welcome, '+ME.name+'. Please read and accept the following to use the system.'
    +(pending.length>1?' Tick both boxes to continue.':'');
  $('#termsDocs').innerHTML=pending.map(d=>termsDocHtml(d,true)).join('');
  $('#termsErr').textContent='';termsTicked();
}
function termsTicked(){
  const boxes=[...document.querySelectorAll('#termsDocs input[type=checkbox]')];
  $('#termsAcceptBtn').disabled=!boxes.length||boxes.some(b=>!b.checked);
}
function acceptTerms(){
  const accepted={};document.querySelectorAll('#termsDocs input[type=checkbox]:checked').forEach(b=>{accepted[b.dataset.doc]=b.dataset.version;});
  $('#termsAcceptBtn').disabled=true;$('#termsErr').textContent='';
  Api.acceptTerms(accepted,res=>{
    if(!res.ok){$('#termsErr').textContent=res.error;if(/updated/.test(res.error))afterSignIn();else termsTicked();return;}
    ME=res.member;enterApp();
  },e=>{termsTicked();$('#termsErr').textContent='Error: '+e.message;});
}
function declineTerms(){
  $('#termsDeclineBtn').disabled=true;
  Api.declineTerms(()=>{
    $('#termsDeclineBtn').disabled=false;ME=null;showManual();
    $('#manualErr').textContent='You declined the terms, so you have been signed out. You can sign in again and accept them at any time.';
  },()=>{$('#termsDeclineBtn').disabled=false;showManual();});
}
// Read the accepted terms again (menu → Terms of use)
function openTermsView(){
  $('#tv_body').innerHTML='<p class="note">Loading&hellip;</p>';om('m_terms');
  $('#tv_edit').classList.toggle('hidden',!isAdminUser());
  Api.getTermsStatus(res=>{$('#tv_body').innerHTML=res.ok?res.documents.map(d=>termsDocHtml(d,false)).join(''):'<p class="note">'+esc(res.error)+'</p>';});
}

// ── Admins: edit and publish the terms ──
// Same reading of the text as the server (_termsFromText in TermsService.gs), for the preview
function termsFromText(text){
  const intro=[],sections=[];let cur=null,last=null;
  String(text||'').replace(/\r/g,'').split('\n').forEach(raw=>{
    const line=raw.trim();
    if(!line){last=null;return;}
    const h=line.match(/^#{1,3}\s*(.+)$/);
    if(h){cur={heading:h[1].trim(),points:[]};sections.push(cur);last=null;return;}
    const p=line.match(/^[-*•]\s*(.+)$/);
    if(p&&cur){cur.points.push(p[1].trim());last={arr:cur.points,i:cur.points.length-1};return;}
    if(last){last.arr[last.i]+=' '+line;return;}
    if(!cur){intro.push(line);return;}
    cur.points.push(line);last={arr:cur.points,i:cur.points.length-1};
  });
  return {intro:intro.join(' '),sections};
}
let TE={docs:[],key:'use'};
function openTermsEditor(){
  cm('m_terms');mst('te_st','','Loading…');om('m_termsEdit');
  Api.getTermsForEditing(res=>{
    if(!res.ok)return mst('te_st','err',res.error);
    TE.docs=res.documents;mst('te_st','','');
    $('#te_tabs').innerHTML=res.documents.map(d=>'<button class="tab" data-k="'+esc(d.key)+'" onclick="showTermsDoc(\''+esc(d.key)+'\')">'+esc(d.title)+'</button>').join('');
    showTermsDoc(TE.key);
  },e=>mst('te_st','err','Error: '+e.message));
}
function showTermsDoc(key){
  const d=TE.docs.find(x=>x.key===key);if(!d)return;TE.key=key;
  document.querySelectorAll('#te_tabs .tab').forEach(b=>b.classList.toggle('on',b.dataset.k===key));
  $('#te_info').textContent=d.appliesTo+'. Current version '+d.version+', '+(d.history.length?'published '+hd(d.updated):'the starting text')
    +'. Accepted by '+d.acceptedCount+' of '+d.appliesCount+' active '+(key==='admin'?'administrators':'users')+'.';
  $('#te_title').value=d.title;$('#te_checkbox').value=d.checkbox;$('#te_text').value=d.text;$('#te_summary').value='';
  $('#te_confirm').checked=false;$('#te_pub').disabled=true;
  $('#te_confirm_lbl').textContent='I understand that '+(key==='admin'?'every administrator':'every member and administrator')+' must accept the new version before they can use the app again.';
  ['title','checkbox','text','summary'].forEach(f=>{$('#te_'+f+'_err').textContent='';});
  $('#te_preview').classList.add('hidden');mst('te_st','','');
  $('#te_history').innerHTML='<p class="note"><strong>Versions published</strong></p>'+(d.history.length
    ?'<table><tbody>'+d.history.map(h=>'<tr><td>v'+esc(h.version)+'</td><td style="white-space:nowrap">'+esc(hdt(h.at))+'</td><td>'+esc(h.by)+'</td><td>'+esc(h.summary)+'</td></tr>').join('')+'</tbody></table>'
    :'<p class="note">None yet: the starting text (version 1) is in use.</p>');
}
function previewTerms(){
  const d=TE.docs.find(x=>x.key===TE.key),p=termsFromText($('#te_text').value);
  $('#te_preview').innerHTML='<p class="note"><strong>Preview</strong> (how members will see it)</p>'
    +termsDocHtml({key:d.key,title:$('#te_title').value,appliesTo:d.appliesTo,version:'(new)',updated:todayISO(),intro:p.intro,sections:p.sections,checkbox:$('#te_checkbox').value},true);
  $('#te_preview').classList.remove('hidden');
}
function publishTermsEdit(){
  ['title','checkbox','text','summary'].forEach(f=>{$('#te_'+f+'_err').textContent='';});
  $('#te_pub').disabled=true;mst('te_st','','Publishing…');
  Api.publishTerms(TE.key,$('#te_title').value,$('#te_checkbox').value,$('#te_text').value,$('#te_summary').value,res=>{
    if(!res.ok){$('#te_pub').disabled=!$('#te_confirm').checked;if(res.field)$('#te_'+res.field+'_err').textContent=res.error;return mst('te_st','err',res.error);}
    mst('te_st','ok','Version '+res.version+' published. Users will be asked to accept it at their next sign-in.');
    setTimeout(()=>{cm('m_termsEdit');showTermsAgain();},1800);   // the publishing admin accepts it too
  },e=>{$('#te_pub').disabled=false;mst('te_st','err','Error: '+e.message);});
}

document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(!$('#s_confirm').classList.contains('hidden'))doConfirm();
  else if(!$('#s_manual').classList.contains('hidden'))doSendOtp();
  else if(!$('#s_otp').classList.contains('hidden'))doVerify();
});
</script>
