<script>
// ── SHARED STATE & HELPERS ─────────────────────────────────────────────────────
let ME=null, MEMBERS=[], SAVINGS_BAL=0, STMT=null, REPAY_LOAN=null, APPROV_REQ=null, REJECT_LR=null, REJECT_WD=null;
// Light is the default; dark is a per-browser choice remembered on this device
function toggleTheme(){
  const dark=document.documentElement.getAttribute('data-theme')!=='dark';
  document.documentElement.setAttribute('data-theme',dark?'dark':'light');
  try{localStorage.setItem('sacco_theme',dark?'dark':'light');}catch(e){}
  document.getElementById('themeBtn').textContent=dark?'Light mode':'Dark mode';
}
// Reader-friendly date for display: "5 Oct 2026" (or "5 Oct 2026, 14:30"). Data keeps yyyy-MM-dd.
function hd(v){
  const str=String(v==null?'':v);
  const m=str.match(/^([0-9]{4})-([0-9]{2})-([0-9]{2})(?: ([0-9]{2}):([0-9]{2}))?/);
  if(!m)return str;
  const d=new Date(+m[1],+m[2]-1,+m[3]);
  const day=d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  return m[4]?day+', '+m[4]+':'+m[5]:day;
}
const $=s=>document.querySelector(s);
const n=v=>{const x=parseFloat(v);return isNaN(x)?0:x;};
const fmt=v=>'UGX '+Math.round(n(v)).toLocaleString('en-US');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const badge=(s,map)=>'<span class="badge '+(map[s.toLowerCase()]||s.toLowerCase())+'">'+esc(s)+'</span>';
const BMAP={active:'active',cleared:'cleared',overdue:'overdue',admin:'admin',member:'member',
  pending:'pending',approved:'approved',rejected:'rejected',unpaid:'unpaid',paid:'paid','partially approved':'partial'};

// ── APP SHELL ───────────────────────────────────────────────────────────────────
function enterApp(){
  $('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');
  $('#whoName').textContent=ME.name+' ('+ME.memberNo+')';
  $('#whoRole').innerHTML=badge(ME.role,BMAP);
  $('#sec-my-savings').classList.toggle('hidden',!!isNonMember());
  $('#card_savings').classList.toggle('hidden',!!isNonMember());
  renderRail();restoreRail();
  showTab('my');setActive('my');loadMyAccount();
}
function doLogout(){
  $('#logoutBtn').disabled=true;
  Api.logout(()=>{
    ME=null;MEMBERS=[];STMT=null;
    $('#appView').classList.add('hidden');
    $('#logoutBtn').disabled=false;
    showOnly('s_loading');
    Api.tryAutoDetect(res=>{
      if(res.detected&&res.email){DET_EMAIL=res.email;$('#detectedEmail').textContent=res.email;showOnly('s_confirm');}
      else showManual();
    }, ()=>showManual());
  }, ()=>{ME=null;$('#appView').classList.add('hidden');showManual();$('#logoutBtn').disabled=false;});
}
function showTab(t){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  ['my','admin','audit'].forEach(n=>$('#tab-'+n).classList.toggle('hidden',n!==t));
  if(t==='admin')loadAdmin();
  if(t==='audit')loadAudit();
}
function loadMyAccount(){
  STMT=null;
  Api.getMySavings(renderSavings);
  Api.getMyLoans(renderLoans);
  Api.getMyLoanRequests(renderLoanReqs);
  Api.getMyWithdrawalRequests(renderWdReqs);
  Api.getMyFines(renderFines);
}


// ── NAVIGATION (desktop rail, phone bottom bar, "Go to" list) ─────────────────
// pane: which top-level area ('my', 'admin', 'audit'). anchor: section id inside that area.
const NAV=[
  {group:'Me', items:[
    {id:'my',       label:'My account',     icon:'⌂', pane:'my',    anchor:null},
    {id:'m-loans',  label:'My loans',       icon:'◎', pane:'my',    anchor:'sec-my-loans'},
    {id:'m-savings',label:'My savings',     icon:'▤', pane:'my',    anchor:'sec-my-savings', savers:true},
    {id:'m-fines',  label:'My surcharges',  icon:'⚑', pane:'my',    anchor:'sec-my-fines'},
    {id:'m-reports',label:'My statement',   icon:'▣', pane:'my',    anchor:'sec-my-reports'},
    {id:'guide',    label:'User guide',     icon:'?', href:true}]},
  {group:'Admin', admin:true, items:[
    {id:'dash',     label:'Dashboard',      icon:'▦', pane:'admin', anchor:'sec-dash'},
    {id:'members',  label:'Members',        icon:'☷', pane:'admin', anchor:'sec-members'},
    {id:'loans',    label:'Loans',          icon:'◎', pane:'admin', anchor:'sec-loans',   badge:'rb-loans'},
    {id:'savings',  label:'Savings',        icon:'▤', pane:'admin', anchor:'sec-savings', badge:'rb-wd'},
    {id:'fines',    label:'Surcharges',     icon:'⚑', pane:'admin', anchor:'sec-fines'},
    {id:'reports',  label:'Reports',        icon:'▣', pane:'admin', anchor:'sec-reports'},
    {id:'audit',    label:'Audit log',      icon:'≡', pane:'audit', anchor:null}]}
];
const BOTTOM_MEMBER=['my','m-loans','m-savings'];
const BOTTOM_ADMIN=['dash','loans','members'];

function isAdminUser(){return ME && ME.role==='Admin';}
// Non-Members have no savings or withdrawals (the server refuses them too)
function isNonMember(){return ME && ME.membershipType==='Non-Member';}
function navItems(){
  return NAV.filter(g=>!g.admin||isAdminUser()).reduce((all,g)=>all.concat(g.items.filter(i=>!(i.savers&&isNonMember())).map(i=>Object.assign({group:g.group},i))),[]);
}

// Builds the rail, the bottom bar and the "Go to" list for the signed-in user
function renderRail(){
  const items=navItems();
  let rail='';
  NAV.filter(g=>!g.admin||isAdminUser()).forEach(g=>{
    rail+='<div class="grp">'+esc(g.group)+'</div>';
    g.items.filter(i=>!(i.savers&&isNonMember())).forEach(i=>{
      rail+='<button class="rail-item" data-s="'+i.id+'" onclick="goSec(\''+i.id+'\')" title="'+esc(i.label)+'">'
        +'<span class="ico">'+i.icon+'</span><span class="lbl">'+esc(i.label)+'</span>'
        +(i.badge?'<span class="rail-badge hidden" id="'+i.badge+'">0</span>':'')+'</button>';
    });
  });
  rail+='<button class="rail-item rail-toggle" onclick="toggleRail()" title="Collapse or expand the menu"><span class="ico">⟨</span><span class="lbl">Collapse menu</span></button>';
  $('#rail').innerHTML=rail;

  const pick=(isAdminUser()?BOTTOM_ADMIN:BOTTOM_MEMBER).filter(id=>items.some(x=>x.id===id));
  $('#bottombar').innerHTML=pick.map(id=>{
    const i=items.find(x=>x.id===id);
    return '<button class="bb-item" data-s="'+id+'" onclick="goSec(\''+id+'\')"><span class="ico">'+i.icon+'</span><span>'+esc(i.label)+'</span></button>';
  }).join('')+'<button class="bb-item" onclick="openMore()"><span class="ico">⋯</span><span>More</span></button>';

  $('#moreList').innerHTML=items.map(i=>
    '<button class="btn" style="text-align:left" onclick="cm(\'m_more\');goSec(\''+i.id+'\')">'+i.icon+'  '+esc(i.label)+'</button>').join('');
}

// The user guide opens in a new tab (served by doGet at ?page=guide)
function openGuide(){window.open(GUIDE_URL,'_blank');}

// Opens the right area and scrolls to the section
function goSec(id){
  const it=navItems().find(x=>x.id===id); if(!it)return;
  if(it.href)return openGuide();
  showTab(it.pane);
  setActive(id);
  if(it.anchor){const el=document.getElementById(it.anchor);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});}
  else window.scrollTo({top:0,behavior:'smooth'});
}
function setActive(id){
  document.querySelectorAll('.rail-item,.bb-item').forEach(b=>b.classList.toggle('on',b.dataset.s===id));
}
function openMore(){om('m_more');}
function toggleRail(){
  const sh=$('#shell'); sh.classList.toggle('collapsed');
  try{localStorage.setItem('sacco_rail',sh.classList.contains('collapsed')?'1':'0');}catch(e){}
}
function restoreRail(){
  try{if(localStorage.getItem('sacco_rail')==='1')$('#shell').classList.add('collapsed');}catch(e){}
}
// Shows a count on a rail item (for example pending requests). Hidden when zero.
function setBadge(id,count){
  const el=document.getElementById(id); if(!el)return;
  el.textContent=count; el.classList.toggle('hidden',!count);
}

// ── MODAL UTIL ────────────────────────────────────────────────────────────────
function om(id){$('#'+id).classList.add('on');}
function cm(id){$('#'+id).classList.remove('on');}
function mbOpts(){return '<option value="">— select —</option>'+MEMBERS.map(m=>'<option value="'+esc(m.memberNo)+'">'+esc(m.memberNo)+' — '+esc(m.name)+'</option>').join('');}
function mst(id,cls,txt){$('#'+id).className='mst'+(cls?' '+cls:'');$('#'+id).textContent=txt;}

document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal-bg.on').forEach(m=>m.classList.remove('on'));});
</script>
