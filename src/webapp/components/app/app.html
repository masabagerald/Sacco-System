<!-- ═══════════════════ APP ═══════════════════ -->
<div class="hidden" id="appView">
  <header>
    <div class="brand">
      <div class="logo logo-img"></div>
      <div>
        <h1>Mbale School of Clinical Officers Investment Club</h1>
        <div class="sub">Member savings &amp; loans</div>
      </div>
    </div>
    <div class="hdr-right">
      <span><b id="whoName"></b> &middot; <span id="whoRole"></span></span>
      <button class="btn sm" id="themeBtn" onclick="toggleTheme()">Dark mode</button>
      <button class="btn sm" id="logoutBtn" onclick="doLogout()">Sign out</button>
    </div>
  </header>

  <div class="shell" id="shell">
    <!-- Desktop navigation rail. Built from NAV in app.js.html -->
    <aside class="rail" id="rail" aria-label="Main navigation"></aside>

    <main>
      <!-- ── MY ACCOUNT ── -->
      <div id="tab-my">
        <section id="sec-my-top"><?!= include('src/webapp/components/dashboard/my') ?></section>
        <section id="sec-my-loans"><?!= include('src/webapp/components/loans/my') ?></section>
        <section id="sec-my-savings"><?!= include('src/webapp/components/savings/my') ?></section>
        <section id="sec-my-fines"><?!= include('src/webapp/components/fines/my') ?></section>
        <section id="sec-my-reports"><?!= include('src/webapp/components/reports/my') ?></section>
      </div>

      <!-- ── ADMIN ── -->
      <div id="tab-admin" class="hidden">
        <section id="sec-dash"><?!= include('src/webapp/components/dashboard/admin') ?></section>
        <section id="sec-members"><?!= include('src/webapp/components/members/admin') ?></section>
        <section id="sec-loans"><?!= include('src/webapp/components/loans/admin') ?></section>
        <section id="sec-savings"><?!= include('src/webapp/components/savings/admin') ?></section>
        <section id="sec-fines"><?!= include('src/webapp/components/fines/admin') ?></section>
        <section id="sec-reports"><?!= include('src/webapp/components/reports/admin') ?></section>
      </div>

      <!-- ── AUDIT LOG ── -->
      <div id="tab-audit" class="hidden">
        <section><?!= include('src/webapp/components/dashboard/audit') ?></section>
      </div>
    </main>
  </div>

  <!-- Phone navigation: four items, the last opens the full list -->
  <nav class="bottombar" id="bottombar" aria-label="Main navigation"></nav>

  <div class="modal-bg" id="m_more" onclick="if(event.target===this)cm('m_more')">
    <div class="modal"><button class="x" onclick="cm('m_more')">&times;</button>
      <h3>Go to</h3>
      <div id="moreList" style="display:grid;gap:6px;margin-top:12px"></div>
    </div>
  </div>
</div>
