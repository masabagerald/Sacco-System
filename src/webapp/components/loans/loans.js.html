<script>
// ── HELPERS ───────────────────────────────────────────────────────────────────
const LR_CACHE={};
let LOAN_PRODUCT=null; // {ok,product:'soft'|'member'|'none',fee,terms?,rate?,minMonths?,membershipType}
const money=v=>Math.round(v).toLocaleString('en-US');
const termTxt=r=>r.termLabel||'';

// Checkbox list of guarantor candidates (Founder Members other than the applicant)
function renderCandidates(id,res){
  const box=$('#'+id);
  if(!res.ok){box.innerHTML='<p class="note">'+esc(res.error)+'</p>';return;}
  box.innerHTML=res.candidates.length
    ?res.candidates.map(c=>'<label><input type="checkbox" value="'+esc(c.memberNo)+'"> '+esc(c.name)+' <span class="note">('+esc(c.memberNo)+')</span></label>').join('')
    :'<p class="note">No eligible Founder Members to pick from.</p>';
}
function pickedGuarantors(id){return [...document.querySelectorAll('#'+id+' input:checked')].map(x=>x.value);}

// ── LOAN PRODUCT, TERM FIELD & QUOTE ───────────────────────────────────────────
// Loads which loan product applies (set by membership type) from the server — the single
// source of truth for rate/fee/term shape. forMemberNo: admin loading for a specific member.
function loadLoanProduct(forMemberNo,cb){
  Api.getLoanTerms(forMemberNo||null, res=>{ LOAN_PRODUCT = res.ok ? res : {product:'none'}; cb&&cb(); });
}
// Renders the term field: a dropdown of terms for a Non-Member Soft Loan, or a "months" input
// (fixed 10% rate) for a Founder/Delegate loan. fid is the rendered field's element id.
function renderTermField(wrapId){
  const w=$('#'+wrapId), fid=wrapId+'_input';
  if(!LOAN_PRODUCT||LOAN_PRODUCT.product==='none'){
    w.innerHTML='<p class="note">Membership type not set. Ask an admin to set it (Founder Member, Delegate Member or Non-Member) before a loan can be requested.</p>';
    return;
  }
  if(LOAN_PRODUCT.product==='soft'){
    w.innerHTML='<select id="'+fid+'">'+LOAN_PRODUCT.terms.map(t=>'<option value="'+esc(t.key)+'">'+esc(t.label)+' ('+t.rate+'% interest)</option>').join('')+'</select>';
  } else {
    w.innerHTML='<input id="'+fid+'" type="number" min="'+LOAN_PRODUCT.minMonths+'" step="1" value="'+LOAN_PRODUCT.minMonths+'">'
      +'<p class="note" style="margin-top:4px">Fixed rate '+LOAN_PRODUCT.rate+'%, fee '+fmt(LOAN_PRODUCT.fee)+'. Minimum '+LOAN_PRODUCT.minMonths+' months.</p>';
  }
}
function termFieldValue(wrapId){ const el=$('#'+wrapId+'_input'); return el?el.value:''; }
// Every loan product needs Founder Member guarantors (Soft Loans included); the server enforces it
function needsGuarantors(){ return !!(LOAN_PRODUCT && (LOAN_PRODUCT.product==='member'||LOAN_PRODUCT.product==='soft')); }

function quoteRow(k,v){ return '<tr><td style="color:var(--dim)">'+k+'</td><td class="r">'+v+'</td></tr>'; }
function quoteTable(p,rate,interest,fee,total,due){
  const dueTxt=due.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  return '<table><tbody>'+
    quoteRow('Principal loan amount',fmt(p))+quoteRow('Interest rate',rate+'%')+quoteRow('Interest amount',fmt(interest))+
    quoteRow('Processing fee',fmt(fee))+quoteRow('<strong>Total amount due</strong>','<strong>'+fmt(total)+'</strong>')+
    quoteRow('Due date (if approved today)',dueTxt)+
    '</tbody></table><p class="note">The due date is counted from the day the loan is approved.</p>';
}
// Breakdown of the total due, shown before submitting. Same arithmetic as the server.
function quoteHtml(amount,wrapId){
  const p=Math.round(n(amount));
  if(!LOAN_PRODUCT||LOAN_PRODUCT.product==='none')return '<p class="note">Enter an amount to see the total due.</p>';
  if(LOAN_PRODUCT.product==='soft'){
    const t=(LOAN_PRODUCT.terms||[]).find(x=>x.key===termFieldValue(wrapId));
    if(!t||!p||p<=0)return '<p class="note">Enter an amount and choose a term to see the total due.</p>';
    const interest=Math.round(p*t.rate/100),total=p+interest+LOAN_PRODUCT.fee;
    const due=new Date();due.setDate(due.getDate()+t.days);
    return quoteTable(p,t.rate,interest,LOAN_PRODUCT.fee,total,due);
  }
  const months=Math.round(n(termFieldValue(wrapId)));
  if(!p||p<=0||!months||months<LOAN_PRODUCT.minMonths)return '<p class="note">Enter an amount and a term of at least '+LOAN_PRODUCT.minMonths+' months.</p>';
  const interest=Math.round(p*LOAN_PRODUCT.rate/100),total=p+interest+LOAN_PRODUCT.fee;
  const due=new Date();due.setMonth(due.getMonth()+months);
  return quoteTable(p,LOAN_PRODUCT.rate,interest,LOAN_PRODUCT.fee,total,due);
}
function updateQuote(amId,wrapId,outId){ $('#'+outId).innerHTML=quoteHtml($('#'+amId).value,wrapId); }

// ── MY LOANS ──────────────────────────────────────────────────────────────────
function renderLoans(res){
  if(!res.ok)return;
  const active=res.loans.filter(l=>l.status==='Active');
  $('#c_outstanding').textContent=fmt(active.reduce((s,l)=>s+l.outstandingBalance,0));
  $('#c_loanMeta').textContent=active.length?active.map(l=>l.loanId).join(', '):'No active loans';
  const el=$('#loansList');
  if(!res.loans.length){el.innerHTML='<p class="note">No loans on record.</p>';return;}
  el.innerHTML=res.loans.map(l=>{
    const flat=l.model==='flat';
    const singleDue=l.model==='term'||l.model==='member';
    const slbl=l.status==='Cleared'?'Cleared':(l.overdue?'Overdue':'Active');
    const s=l.status==='Cleared'?'cleared':(l.overdue?'overdue':'active');
    const repBtn=ME.role==='Admin'&&l.status==='Active'?'<button class="btn sm" onclick="openRepay(\''+l.loanId+'\','+l.outstandingBalance+')">Record Repayment</button>':'';
    const sid='sc_'+l.loanId;
    const stats=[
      ['Principal',money(l.principal)],
      ['Interest',l.rateLabel],
      ['Term',l.termLabel],
      ['Outstanding',money(l.outstandingBalance)],
      [l.model==='reducing'?'Est. Payment':'Total due',money(l.model==='reducing'?l.monthlyPayment:l.totalDue)],
      ['Repaid',money(l.totalRepaid)]
    ];
    if(l.dueDate)stats.push(['Due date',esc(hd(l.dueDate))]);
    const head=singleDue
      ?'<p class="note">Interest '+l.rateLabel+' plus a UGX '+money(l.processingFee)+' processing fee. The full amount is due on '+esc(hd(l.dueDate))+'.</p>'
      :(flat?'<p class="note">Interest 10% flat plus a UGX '+money(l.processingFee)+' processing fee. Repay in two equal instalments: week 4 and week 8.</p>':'');
    const pen=l.penalty>0?'<p class="note" style="color:var(--bad)">'+(flat?'Late penalty applied (10% of the balance unpaid at week 8): ':'Overdue surcharge applied (10% of loan + interest): ')+fmt(l.penalty)+'</p>':'';
    const right=i=>l.model==='reducing'?i>=1:i>=2;
    const schTh=(l.scheduleHead||['Month','Opening','Interest','Payment','Closing']).map((h,i)=>'<th'+(right(i)?' class="r"':'')+'>'+h+'</th>').join('');
    const schRows=l.model==='reducing'
      ?l.schedule.map(r=>'<tr><td>'+r.month+'</td><td class="r">'+money(r.opening)+'</td><td class="r">'+money(r.interest)+'</td><td class="r">'+money(r.payment)+'</td><td class="r">'+money(r.closing)+'</td></tr>').join('')
      :l.schedule.map(r=>'<tr><td>'+esc(r.label)+'</td><td>'+esc(hd(r.due))+'</td><td class="r">'+money(r.amount)+'</td><td class="r">'+money(r.balance)+'</td></tr>').join('');
    return '<div class="loan-card"><div class="loan-hd"><span class="lid">'+esc(l.loanId)+'</span>'+badge(slbl,{cleared:'cleared',overdue:'overdue',active:'active'})+'</div>'+
      '<div class="loan-stats">'+stats.map(([k,v])=>'<div><div class="ls-k">'+k+'</div><div class="ls-v">'+v+'</div></div>').join('')+'</div>'+
      head+pen+(l.overrideReason?'<p class="note">Override: '+esc(l.overrideReason)+'</p>':'')+
      '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">'+
      '<button class="btn sm" onclick="toggleSched(\''+sid+'\')">Schedule</button>'+repBtn+'</div>'+
      '<div class="sched" id="'+sid+'"><table><thead><tr>'+schTh+'</tr></thead><tbody>'+schRows+'</tbody></table></div></div>';
  }).join('');
}
function toggleSched(id){$('#'+id).classList.toggle('on');}
function renderLoanReqs(res){
  if(!res.ok)return;
  const tb=$('#loanReqTb');
  if(!res.requests.length){tb.innerHTML='<tr class="empty"><td colspan="6">No loan requests.</td></tr>';return;}
  tb.innerHTML=res.requests.map(r=>{
    const w=r.waiver;
    const wv=w?'<div class="note">Loan with security ('+esc(w.security)+'). Waiver: '+esc(w.status)+(w.status==='Pending Waiver Approval'||w.status==='Partially Approved'?' — '+w.approvals+' of '+w.required+' approvals':'')+'</div>'
      +w.failed.map(f=>'<div class="note">Not met: '+esc(f)+'</div>').join(''):'';
    return '<tr><td>'+esc(r.requestId)+'</td><td class="r">'+money(r.amount)+'</td><td>'+esc(r.termLabel)+'<div class="note">Total due '+fmt(r.total)+'</div></td><td>'+esc(r.purpose)+'</td><td>'+badge(r.status,BMAP)+wv+'</td><td>'+esc(r.decisionNotes)+'</td></tr>';
  }).join('');
}

// ── ADMIN: LOAN REQUESTS ──────────────────────────────────────────────────────
// ── ACTIVE LOANS (admin): every member's running loan, with Record Repayment ──
let ACTIVE_LOANS=[];
function loadActiveLoansAdmin(){
  Api.getActiveLoans(res=>{
    if(!res.ok){$('#activeLoansTb').innerHTML='<tr class="empty"><td colspan="8">'+esc(res.error)+'</td></tr>';return;}
    ACTIVE_LOANS=res.loans;renderActiveLoansAdmin();
  });
}
function renderActiveLoansAdmin(){
  const q=($('#al_q').value||'').trim().toLowerCase();
  const rows=ACTIVE_LOANS.filter(l=>!q||(l.loanId+' '+l.memberNo+' '+l.name).toLowerCase().indexOf(q)>-1);
  $('#activeLoansTb').innerHTML=rows.length?rows.map(l=>'<tr><td>'+esc(l.loanId)+(l.overdue?' '+badge('Overdue',BMAP):'')+'</td>'
    +'<td>'+esc(l.memberNo)+' — '+esc(l.name)+'<div class="note">'+esc(l.membershipType||'type not set')+'</div>'
    +'<div class="note">Guarantors: '+((l.guarantors||[]).length?l.guarantors.map(g=>esc(g.name)+' ('+esc(g.memberNo)+')'+(g.respondedAt?' - consented '+esc(g.respondedAt):'')).join(', '):'none on file')+'</div>'
    +((l.guarantorNotices&&l.guarantorNotices.count)?'<div class="note">'+l.guarantorNotices.count+' guarantor notice(s) sent, last '+esc(l.guarantorNotices.last)+'</div>':'')+'</td>'
    +'<td>'+esc(hd(l.dateIssued))+'</td><td>'+esc(l.dueDate?hd(l.dueDate):'—')+'</td>'
    +'<td class="r">'+money(l.totalDue)+'</td><td class="r">'+money(l.totalRepaid)+'</td><td class="r"><b>'+money(l.outstandingBalance)+'</b></td>'
    +'<td><button class="btn sm solid" onclick="openRepay(\''+esc(l.loanId)+'\','+l.outstandingBalance+')">Record Repayment</button></td></tr>').join('')
    :'<tr class="empty"><td colspan="8">'+(ACTIVE_LOANS.length?'No loan matches the filter.':'No active loans.')+'</td></tr>';
}

// ── REPAYMENTS (admin): list, with Reverse for a repayment entered wrongly ────
let REPAYMENTS=[], REV_REPAY=null;
function loadRepaymentsAdmin(){
  Api.getRepayments(res=>{
    if(!res.ok){$('#repaymentsTb').innerHTML='<tr class="empty"><td colspan="7">'+esc(res.error)+'</td></tr>';return;}
    REPAYMENTS=res.repayments;
    $('#rpl_note').textContent=res.ready?'':'Repayments can be reversed once the system administrator has run setupFinanceSchema() in the Apps Script editor.';
    renderRepaymentsAdmin();
  });
}
function renderRepaymentsAdmin(){
  const q=($('#rpl_q').value||'').trim().toLowerCase();
  const rows=REPAYMENTS.filter(r=>!q||(r.reference+' '+r.loanId+' '+r.memberNo+' '+r.name).toLowerCase().indexOf(q)>-1);
  const shown=rows.slice(0,100);
  $('#repaymentsTb').innerHTML=shown.length?shown.map(r=>{
    const rev=r.amount<0;
    const act=r.reversedBy?'<span class="note">Reversed by '+esc(r.reversedBy)+'</span>'
      :(!rev&&r.reference?'<button class="btn sm danger" onclick="openRevRepay(\''+esc(r.reference)+'\')">Reverse</button>':'');
    return '<tr><td>'+esc(hd(r.date))+'</td><td>'+esc(r.reference||'—')+(rev?'<div class="note">reverses '+esc(r.reverses)+'</div>':'')+'</td><td>'+esc(r.loanId)+'</td>'
      +'<td>'+esc(r.memberNo)+' — '+esc(r.name)+'</td>'+signedCell(rev?-1:1,Math.abs(r.amount))+'<td>'+esc(r.notes)+'<div class="note">by '+esc(r.recordedBy)+'</div></td><td>'+act+'</td></tr>';
  }).join('')+(rows.length>100?'<tr class="empty"><td colspan="7">Showing the newest 100. Filter to find older repayments.</td></tr>':'')
    :'<tr class="empty"><td colspan="7">'+(REPAYMENTS.length?'No repayment matches the filter.':'No repayments yet.')+'</td></tr>';
}
function openRevRepay(ref){
  const r=REPAYMENTS.find(x=>x.reference===ref); if(!r)return;
  REV_REPAY=ref;
  $('#rr_info').textContent=ref+': '+fmt(r.amount)+' on loan '+r.loanId+' ('+r.name+'), dated '+hd(r.date);
  $('#rr_rs').value='';mst('rr_st','','');om('m_revRepay');
}
function submitRevRepay(){
  const rs=$('#rr_rs').value.trim(); if(!rs)return mst('rr_st','err','Enter the reason.');
  $('#rr_btn').disabled=true;mst('rr_st','','Saving…');
  Api.reverseRepayment(REV_REPAY,rs,res=>{
    $('#rr_btn').disabled=false;
    if(!res.ok)return mst('rr_st','err',res.error);
    mst('rr_st','ok','Reversed as '+res.reference+'. Outstanding on the loan: '+fmt(res.outstandingBalance));
    loadAdmin();setTimeout(()=>cm('m_revRepay'),1200);
  },e=>{$('#rr_btn').disabled=false;mst('rr_st','err','Error: '+e.message);});
}

function loadLoanReqAdmin(){
  Api.getLoanRequests(res=>{
    if(!res.ok)return;
    const tb=$('#loanReqAdminTb');
    if(!res.requests.length){tb.innerHTML='<tr class="empty"><td colspan="8">No requests.</td></tr>';return;}
    res.requests.forEach(r=>{LR_CACHE[r.requestId]=r;});
    tb.innerHTML=res.requests.map(r=>{
      const w=r.waiver;
      const lim=!r.savingsLimit?'<span class="note">No savings cap (Soft Loan)</span>'
        :r.waivedLimit?'<span class="badge approved">Waived (secured loan)</span>'
        :(r.withinLimit?'<span class="badge approved">Within limit</span>':'<span class="badge overdue">Over limit</span>');
      const glist=r.guarantors.length?r.guarantors:(r.pendingGuarantors||[]);
      const gl=glist.length?glist.map(g=>esc(g.name)+' ('+esc(g.memberNo)+') - '+esc(g.response)).join(', '):'None on file';
      const sec=w?'<div class="note"><span class="badge partial">Loan with security</span> Waiver: '+esc(w.status)+' ('+w.approvals+' of '+w.required+' approvals)'
        +(w.stillNeeded?' '+esc(w.stillNeeded):'')+'</div>':'';
      const ov=r.guarantorOverride?'<div class="note" style="color:var(--warn)">Guarantor restriction override: '+esc(r.guarantorOverride)+'</div>':'';
      const due=r.decisionOverdue?'<div class="note" style="color:var(--bad)">Decision overdue ('+r.daysPending+' days, limit 3)</div>'
        :(r.daysPending!==null?'<div class="note">Pending '+r.daysPending+' day(s)</div>':'');
      // Both guarantors consent first; only then can two different admins approve. ("Awaiting Guarantors"
      // is left over from the earlier any-order flow: both admins approved, the loan is issued at the last acceptance.)
      const awaiting=r.status==='Awaiting Guarantors';
      const waiting=r.status==='Pending Waiver Approval';
      const open=r.status==='Pending'||r.status==='Partially Approved'||awaiting;
      const allAccepted=!r.guarantorsRequired||(r.guarantors.length===2&&r.guarantors.every(g=>g.response==='Accepted'));
      const why=ME.memberNo===r.initiatedBy?'You initiated this request — another admin must approve it.'
        :ME.memberNo===String(r.memberNo)?'This is your own loan — another admin must approve it.'
        :(!awaiting&&ME.memberNo===r.approver1)?'You have approved — a different admin must give the other approval.':'';
      const already=open&&why?'<div class="note">'+why+'</div>':'';
      const nAppr=(r.approver1?1:0)+(r.approver2?1:0);
      const approvals='<div class="note">Admin approvals: '+nAppr+' of 2'+(nAppr?' ('+esc(r.approver1Name)+(r.approver2Name?', '+esc(r.approver2Name):'')+')':'')+'</div>'
        +(r.guarantorsRequired&&!allAccepted&&open?'<div class="note">Waiting for guarantor'+(r.guarantors.filter(g=>g.response!=='Accepted').length>1?'s':'')+' to consent. Admins can approve only after both guarantors have accepted.</div>':'');
      const canAct=open&&!why;
      const approveBtn=!allAccepted?''
        :awaiting?'<button class="btn sm solid" onclick="openApproveLR(\''+r.requestId+'\')">Issue loan</button> '
        :'<button class="btn sm" onclick="openApproveLR(\''+r.requestId+'\')">Approve</button> ';
      const canDecide=w&&(!w.approveBlock||!w.rejectBlock);
      const acts=waiting
        ?'<button class="btn sm'+(canDecide?' solid':'')+'" onclick="openWaiver(\''+r.requestId+'\')">'+(canDecide?'Decide waiver':'Waiver details')+'</button>'
        :(canAct?approveBtn+'<button class="btn sm danger" onclick="openRejectLR(\''+r.requestId+'\')">Reject</button>':already)
          +(w?' <button class="btn sm" onclick="openWaiver(\''+r.requestId+'\')">Waiver details</button>':'');
      return '<tr><td>'+esc(r.requestId)+'</td><td>'+esc(r.memberName)+'<div class="note">'+esc(r.membershipType||'—')+' &middot; Guarantors: '+gl+'</div><div class="note">Initiated by '+esc(r.initiatedByName)+'</div>'+sec+ov+(waiting?'':approvals)+'</td><td class="r">'+money(r.amount)+'<div class="note">Total '+fmt(r.total)+'</div></td><td>'+esc(r.termLabel)+'</td><td>'+esc(r.purpose)+'</td><td>'+lim+'</td><td>'+badge(r.status,BMAP)+due+'</td><td>'+acts+'</td></tr>';
    }).join('');
  });
}

// ── request loan ──────────────────────────────────────────────────────────────
function openReqLoan(){
  $('#rl_am').value='';$('#rl_pu').value='';mst('rl_st','','');
  $('#rl_gt').innerHTML='';$('#rl_gtwrap').classList.add('hidden');
  $('#rl_q').innerHTML='';$('#rl_tmwrap').innerHTML='<p class="note">Loading&hellip;</p>';
  $('#rl_cov').innerHTML='';COV={seq:0,timer:null,res:null};
  om('m_reqLoan');
  loadLoanProduct(null, ()=>{
    renderTermField('rl_tmwrap');
    updateQuote('rl_am','rl_tmwrap','rl_q');
    $('#rl_gtwrap').classList.toggle('hidden', !needsGuarantors());
    if(needsGuarantors()) Api.getGuarantorCandidates(null, res=>renderCandidates('rl_gt',res));
  });
}
function submitReqLoan(){
  const am=$('#rl_am').value, tm=termFieldValue('rl_tmwrap');
  if(!am||n(am)<=0)return mst('rl_st','err','Enter a valid amount.');
  if(!LOAN_PRODUCT||LOAN_PRODUCT.product==='none')return mst('rl_st','err','Your membership type has not been set. Contact an admin.');
  if(!tm)return mst('rl_st','err','Choose a repayment term.');
  const gs=needsGuarantors()?pickedGuarantors('rl_gt'):[];
  if(needsGuarantors()&&gs.length!==2)return mst('rl_st','err','Select exactly two guarantors.');
  $('#rl_btn').disabled=true;mst('rl_st','','Submitting…');
  Api.requestLoan(am,tm,$('#rl_pu').value.trim(),gs, res=>{
    $('#rl_btn').disabled=false;
    if(!res.ok){mst('rl_st','err',res.error);if(res.securedAvailable)loadCoverage();return;}
    mst('rl_st','ok','Request '+res.requestId+' submitted. Total due if approved: '+fmt(res.total)+'.');loadMyAccount();setTimeout(()=>cm('m_reqLoan'),1500);
  }, e=>{$('#rl_btn').disabled=false;mst('rl_st','err','Error: '+e.message);});
}

// ── savings coverage & loan with security (ISS-11) ────────────────────────────
// The server checks the two coverage requirements (applicant cap, guarantors' 25%) as the member fills
// in the form. If one fails, a Founder Member is offered "Request for a Loan with Security".
let COV={seq:0,timer:null,res:null}, SEC_REQ=null;
function queueCoverage(){clearTimeout(COV.timer);COV.timer=setTimeout(loadCoverage,400);}
function loadCoverage(){
  const am=n($('#rl_am').value), tm=termFieldValue('rl_tmwrap'), gs=pickedGuarantors('rl_gt');
  if(!am||!LOAN_PRODUCT||LOAN_PRODUCT.product!=='member'){$('#rl_cov').innerHTML='';COV.res=null;return;}
  const seq=++COV.seq;
  Api.checkLoanCoverage(am,tm,gs,null,res=>{if(seq===COV.seq)renderCoverage(res);});
}
function renderCoverage(res){
  COV.res=res.ok?res:null;
  if(!res.ok){$('#rl_cov').innerHTML='';return;}
  const pct=v=>Math.round(v*10)/10+'%';
  const line=(ok,txt)=>'<div class="note" style="color:var('+(ok?'--good':'--bad')+')">'+(ok?'✓ ':'✗ ')+txt+'</div>';
  let h='<label>Savings coverage</label>';
  if(res.applicant)h+=line(res.applicant.ok,'Your Principal savings '+fmt(res.applicant.savings)+': loans up to '+fmt(res.applicant.maxLoan)+' ('+res.applicant.limitPct+'% of savings).');
  res.guarantors.forEach(g=>{h+=line(g.ok,esc(g.name)+' ('+esc(g.memberNo)+'): savings cover '+pct(g.coveragePct)+' of the loan; '+g.requiredPct+'% needed.');});
  if(res.failed.length&&res.securedAvailable)h+='<div class="lim-warn">This request does not meet the savings coverage required by the constitution. '
    +(res.applicant&&!res.applicant.ok&&!res.failed.some(f=>/^Guarantor/.test(f))?'You can still submit it for the admins to consider a limit override, or ':'You can ')
    +'offer an asset as security and ask the committee to waive the requirement.'
    +'<div style="margin-top:8px"><button class="btn sm solid" onclick="openSecuredLoan()">Request for a Loan with Security</button></div></div>';
  else if(res.failed.length)h+='<div class="lim-warn">This request does not meet the savings coverage required by the constitution.</div>';
  $('#rl_cov').innerHTML=h;
}
function openSecuredLoan(){
  const am=$('#rl_am').value, tm=termFieldValue('rl_tmwrap'), gs=pickedGuarantors('rl_gt');
  if(!am||n(am)<=0)return mst('rl_st','err','Enter a valid amount.');
  if(!tm)return mst('rl_st','err','Choose a repayment term.');
  if(gs.length!==2)return mst('rl_st','err','Select exactly two guarantors first.');
  const res=COV.res;
  SEC_REQ={amount:am,term:tm,purpose:$('#rl_pu').value.trim(),guarantors:gs};
  const names=gs.map(no=>{const el=document.querySelector('#rl_gt input[value="'+no+'"]');return el?el.parentNode.textContent.trim():no;});
  $('#sl_summary').innerHTML='<table><tbody>'+quoteRow('Amount',fmt(am))+quoteRow('Guarantors',esc(names.join(', ')))+'</tbody></table>'
    +(res&&res.failed.length?'<div class="lim-warn"><strong>Requirement not met</strong>'+res.failed.map(f=>'<div>'+esc(f)+'</div>').join('')+'</div>':'');
  ['type','otherType','value','description','ownership','documents','justification'].forEach(f=>secFieldError(f,''));
  mst('sl_st','','');$('#sl_btn').disabled=false;
  cm('m_reqLoan');om('m_secLoan');
}
function secTypeChanged(){$('#sl_otherwrap').classList.toggle('hidden',$('#sl_type').value!=='Others');}
function backToReqLoan(){cm('m_secLoan');om('m_reqLoan');}
function secFieldError(f,msg){const e=$('#sl_'+f+'_err');if(e)e.textContent=msg||'';const i=$('#sl_'+f);if(i)i.classList.toggle('invalid',!!msg);}
function submitSecuredLoan(){
  if(!SEC_REQ)return;
  const sec={type:$('#sl_type').value,otherType:$('#sl_otherType').value.trim(),description:$('#sl_description').value.trim(),
    value:$('#sl_value').value,ownership:$('#sl_ownership').value.trim(),documents:$('#sl_documents').value,justification:$('#sl_justification').value.trim()};
  // Quick checks here; the server checks everything again
  const errs={};
  if(!sec.type)errs.type='Choose the type of security.';
  if(sec.type==='Others'&&!sec.otherType)errs.otherType='Specify the type of security.';
  if(sec.description.length<5)errs.description='Describe the security.';
  if(!(n(sec.value)>0))errs.value='Enter the estimated value.';
  if(!sec.ownership)errs.ownership='Give the ownership details.';
  if(sec.documents.split(/[\r\n]+/).map(x=>x.trim()).filter(Boolean).some(d=>!/^https:\/\/\S+$/i.test(d)))errs.documents='Each link must start with https://, one per line.';
  if(!sec.justification)errs.justification='Explain why the waiver should be granted.';
  ['type','otherType','value','description','ownership','documents','justification'].forEach(f=>secFieldError(f,errs[f]));
  if(Object.keys(errs).length)return mst('sl_st','err','Please correct the highlighted fields.');
  $('#sl_btn').disabled=true;mst('sl_st','','Submitting…');
  Api.requestSecuredLoan(SEC_REQ.amount,SEC_REQ.term,SEC_REQ.purpose,SEC_REQ.guarantors,sec,res=>{
    if(!res.ok){$('#sl_btn').disabled=false;if(res.field)secFieldError(res.field,res.error);return mst('sl_st','err',res.error);}
    mst('sl_st','ok','Request '+res.requestId+' submitted for waiver approval. You will be emailed as the committee decides.');
    loadMyAccount();setTimeout(()=>cm('m_secLoan'),2000);
  },e=>{$('#sl_btn').disabled=false;mst('sl_st','err','Error: '+e.message);});
}

// ── waiver details & decision (committee administrators) ──────────────────────
let WAIVER_REQ=null;
function openWaiver(id){
  const r=LR_CACHE[id]; if(!r||!r.waiver)return;
  WAIVER_REQ=id; const w=r.waiver, s=w.security;
  $('#wv_info').textContent=id+': '+r.memberName+' ('+(r.membershipType||'—')+') requests '+fmt(r.amount)+' over '+r.termLabel+'. Waiver: '+w.status+' ('+w.approvals+' of '+w.required+' approvals). '+(w.stillNeeded||'');
  const row=(k,v)=>quoteRow(k,v);
  $('#wv_body').innerHTML='<div class="lim-warn"><strong>Requirement not met</strong>'+w.failed.map(f=>'<div>'+esc(f)+'</div>').join('')+'</div>'
    +'<table><tbody>'
    +(w.loanCap?row('Applicant Principal savings',fmt(w.applicantSavings)+' (covers '+w.applicantCoveragePct+'% of the loan; cap '+fmt(w.loanCap)+')'):'')
    +w.guarantorCoverage.map(g=>row('Guarantor '+esc(g.memberNo),esc(g.name)+': '+fmt(g.savings)+' ('+g.coveragePct+'%, needs '+g.requiredPct+'%)')).join('')
    +row('Security',esc(s.type))+row('Description',esc(s.description))
    +row('Estimated value',fmt(s.value)+' <span class="note">declared, not verified</span>')+row('Ownership',esc(s.ownership))
    +row('Documents',s.documents.length?s.documents.map(d=>'<a href="'+esc(d)+'" target="_blank" rel="noopener">'+esc(d)+'</a>').join('<br>'):'None')
    +row('Justification',esc(s.justification))+row('Submitted',esc(hdt(w.submittedAt)))
    +'</tbody></table>'
    +'<p class="note"><strong>Decisions</strong></p>'+(w.decisions.length?'<table><tbody>'+w.decisions.map(d=>'<tr><td>'+esc(hdt(d.at))+'</td><td>'+esc(d.name)+' ('+esc(d.adminNo)+', '+esc(d.role)+')</td><td>'+badge(d.decision,BMAP)+'</td><td>'+esc(d.comment)+'</td></tr>').join('')+'</tbody></table>':'<p class="note">None yet.</p>');
  const open=r.status==='Pending Waiver Approval';
  $('#wv_app').classList.toggle('hidden',!open||!!w.approveBlock);
  $('#wv_rej').classList.toggle('hidden',!open||!!w.rejectBlock);
  $('#wv_form').classList.toggle('hidden',!open||(!!w.approveBlock&&!!w.rejectBlock));
  $('#wv_block').textContent=open&&w.approveBlock?w.approveBlock:'';
  $('#wv_comment').value='';mst('wv_st','','');$('#wv_app').disabled=false;$('#wv_rej').disabled=false;
  om('m_waiver');
}
function decideWaiver(kind){
  const c=$('#wv_comment').value.trim();
  if(kind==='reject'&&!c)return mst('wv_st','err','Enter the reason for rejecting. It is sent to the applicant.');
  $('#wv_app').disabled=true;$('#wv_rej').disabled=true;mst('wv_st','','Saving…');
  const done=res=>{
    if(!res.ok){$('#wv_app').disabled=false;$('#wv_rej').disabled=false;return mst('wv_st','err',res.error);}
    mst('wv_st','ok',res.stage==='approved'?'Waiver approved. The guarantors have been asked to consent.':res.stage==='rejected'?'Waiver rejected; the applicant has been told why.':'Approval recorded. '+(res.message||''));
    loadLoanReqAdmin();loadAdmin();setTimeout(()=>cm('m_waiver'),1500);
  };
  const fail=e=>{$('#wv_app').disabled=false;$('#wv_rej').disabled=false;mst('wv_st','err','Error: '+e.message);};
  if(kind==='approve')Api.approveLoanWaiver(WAIVER_REQ,c,done,fail); else Api.rejectLoanWaiver(WAIVER_REQ,c,done,fail);
}

// ── issue loan ────────────────────────────────────────────────────────────────
function openIssueLoan(){
  $('#ln_mb').innerHTML=mbOpts();$('#ln_pr').value='';$('#ln_pu').value='';$('#ln_ov').value='';
  $('#ln_lim').classList.add('hidden');
  $('#ln_gt').innerHTML='';$('#ln_gtwrap').classList.add('hidden');
  $('#ln_q').innerHTML='';$('#ln_tmwrap').innerHTML='<p class="note">Select a member first.</p>';
  LOAN_PRODUCT=null;
  mst('ln_st','','');om('m_loan');
}
function onIssueMemberChange(){
  updateLimitInfo();
  const mb=$('#ln_mb').value;
  if(!mb){$('#ln_tmwrap').innerHTML='<p class="note">Select a member first.</p>';$('#ln_gtwrap').classList.add('hidden');LOAN_PRODUCT=null;return;}
  $('#ln_gt').innerHTML='<p class="note">Loading&hellip;</p>';
  $('#ln_tmwrap').innerHTML='<p class="note">Loading&hellip;</p>';
  loadLoanProduct(mb, ()=>{
    renderTermField('ln_tmwrap');
    updateQuote('ln_pr','ln_tmwrap','ln_q');
    $('#ln_gtwrap').classList.toggle('hidden', !needsGuarantors());
    if(needsGuarantors()) Api.getGuarantorCandidates(mb, res=>renderCandidates('ln_gt',res));
  });
}
function updateLimitInfo(){
  const mb=$('#ln_mb').value,pr=n($('#ln_pr').value);
  const box=$('#ln_lim');
  const m=MEMBERS.find(x=>x.memberNo===mb);
  if(!mb||!pr||!m||m.membershipType==='Non-Member'){box.classList.add('hidden');return;}
  const max=n(m.principalBalance)*0.5;
  if(pr>max){box.classList.remove('hidden');box.textContent='Exceeds the 50% savings guideline (Principal savings '+fmt(m.principalBalance)+', max '+fmt(max)+'). The approving admins can override this with a reason.';}
  else box.classList.add('hidden');
}
function submitLoan(){
  const mb=$('#ln_mb').value,pr=$('#ln_pr').value,tm=termFieldValue('ln_tmwrap');
  if(!mb)return mst('ln_st','err','Select a member.');
  if(!pr||n(pr)<=0)return mst('ln_st','err','Enter a valid principal.');
  if(!LOAN_PRODUCT||LOAN_PRODUCT.product==='none')return mst('ln_st','err','This member\'s membership type has not been set.');
  if(!tm)return mst('ln_st','err','Choose a repayment term.');
  const gs=needsGuarantors()?pickedGuarantors('ln_gt'):[];
  if(needsGuarantors()&&gs.length!==2)return mst('ln_st','err','Select exactly two guarantors.');
  $('#ln_btn').disabled=true;mst('ln_st','','Saving…');
  Api.issueLoan(mb,pr,$('#ln_pu').value.trim(),gs,tm,$('#ln_ov').value.trim(), res=>{
    $('#ln_btn').disabled=false;
    if(!res.ok)return mst('ln_st','err',res.error);
    mst('ln_st','ok','Proposed as request '+res.requestId+'. It needs two different admin approvals before the loan is issued.');
    loadLoanReqAdmin();loadAdmin();setTimeout(()=>cm('m_loan'),1800);
  }, e=>{$('#ln_btn').disabled=false;mst('ln_st','err','Error: '+e.message);});
}

// ── repayment ─────────────────────────────────────────────────────────────────
// The breakdown comes from the server (getRepaymentPreview), which splits the payment exactly as the
// recorded repayment will be split: processing fee, interest, surcharge/penalty, then principal.
// RP: { seq, timer, preview (matching the current inputs, or null), saving, done }
let RP={seq:0,timer:null,preview:null,saving:false,done:false};
function openRepay(lid,bal){
  REPAY_LOAN=lid;RP={seq:0,timer:null,preview:null,saving:false,done:false};
  const al=ACTIVE_LOANS.find(l=>l.loanId===lid);
  $('#rp_info').textContent='Loan '+lid+(al?' — '+al.name+' ('+al.memberNo+')':'')+' — outstanding: '+fmt(bal);
  $('#rp_am').value='';$('#rp_dt').value=todayISO();$('#rp_nt').value='';mst('rp_st','','');
  $('#rp_tb').innerHTML='<tr class="empty"><td colspan="6">Loading&hellip;</td></tr>';$('#rp_warn').innerHTML='';$('#rp_order').textContent='';
  $('#rp_btn').disabled=true;
  om('m_repay');loadRepayPreview();
}
// Input changed: the old breakdown no longer applies, so saving waits for the new one
function queueRepayPreview(){
  RP.preview=null;$('#rp_btn').disabled=true;mst('rp_st','','');
  clearTimeout(RP.timer);RP.timer=setTimeout(loadRepayPreview,350);
}
function loadRepayPreview(){
  const raw=$('#rp_am').value.trim(), am=raw===''?0:Number(raw), dt=$('#rp_dt').value;
  $('#rp_warn').innerHTML='';
  if(raw!==''&&!isFinite(am))return repayWarn('Enter the amount as a number.');
  if(am<0)return repayWarn('The amount cannot be negative. To undo a repayment, use Reverse in the Repayments list.');
  const seq=++RP.seq;
  Api.getRepaymentPreview(REPAY_LOAN,am,dt,res=>{
    if(seq!==RP.seq||!$('#m_repay').classList.contains('on'))return;  // a newer request is on its way
    if(!res.ok){$('#rp_tb').innerHTML='<tr class="empty"><td colspan="6">'+esc(res.error)+'</td></tr>';return;}
    renderRepayPreview(res);
  },e=>{if(seq===RP.seq)repayWarn('Could not load the breakdown: '+e.message);});
}
function repayWarn(msg){$('#rp_warn').innerHTML='<div class="lim-warn">'+esc(msg)+'</div>';$('#rp_btn').disabled=true;}
function renderRepayPreview(p){
  RP.preview=p;
  const m=v=>Math.round(n(v)).toLocaleString('en-US');
  const paying=p.amount>0;
  const rows=p.components.map(c=>{
    const na=c.status==='Not applicable';
    return '<tr><td>'+esc(c.label)+'<div class="st">'+esc(c.status)+(c.chargeChanged?' · charge changes with this payment date':'')+'</div></td>'
      +'<td class="r">'+(na?'—':m(c.charged))+'</td><td class="r">'+(na?'—':m(c.paidBefore))+'</td>'
      +'<td class="r">'+(na?'—':m(c.outstandingBefore))+'</td>'
      +'<td class="r'+(c.allocated>0?' alloc':'')+'">'+(paying&&!na?m(c.allocated):'—')+'</td>'
      +'<td class="r">'+(na?'—':paying?m(c.balanceAfter):m(c.outstandingBefore))+'</td></tr>';
  });
  const cr=p.credit;
  if(cr.before!==0||cr.allocated>0){
    rows.push('<tr><td>'+(cr.before<0?'Credit owed back':'Credit held')+'<div class="st">'+(cr.before<0?'a reversal took back credit already used':'overpayment kept on the loan')+'</div></td>'
      +'<td class="r">—</td><td class="r">—</td><td class="r">'+(cr.before?m(-cr.before):'0')+'</td>'
      +'<td class="r'+(cr.allocated>0?' alloc':'')+'">'+(paying?m(cr.allocated):'—')+'</td><td class="r">'+(paying?m(-cr.after):m(-cr.before))+'</td></tr>');
  }
  rows.push('<tr class="tot"><td>Total</td><td></td><td></td><td class="r">'+m(p.totals.outstandingBefore)+'</td>'
    +'<td class="r">'+(paying?m(p.totals.amount):'—')+'</td><td class="r">'+m(paying?p.totals.outstandingAfter:p.totals.outstandingBefore)+'</td></tr>');
  $('#rp_tb').innerHTML=rows.join('');
  const name={fee:'processing fee',interest:'interest',penalty:'surcharge / penalty',principal:'principal'};
  $('#rp_order').textContent='Each payment is applied in this order (club rule): '+p.allocationOrder.map(k=>name[k]||k).join(' → ')
    +'. Anything over the amount owed is held as credit on the loan. Amounts in UGX.';

  // Checks before saving
  const w=[];
  if(!p.reconciles)w.push('<div class="lim-warn">The parts do not add up to the loan balance. Do not record this repayment; ask the system administrator to check the loan.</div>');
  if(p.status!=='Active')w.push('<div class="lim-warn">This loan is already '+esc(p.status)+'. Any payment on it is held as credit.</div>');
  if(p.overpayment>0)w.push('<div class="lim-warn">'+fmt(p.amount)+' is '+fmt(p.overpayment)+' more than the '+fmt(p.totals.outstandingBefore)+' outstanding.'
    +'<label><input type="checkbox" id="rp_ovok" onchange="updateRepayBtn()"> Hold the excess '+fmt(p.overpayment)+' as credit on this loan</label></div>');
  if(p.similar&&p.similar.length)w.push('<div class="lim-warn">A repayment of '+fmt(p.amount)+' dated '+esc(hd(p.date))+' is already recorded on this loan ('
    +p.similar.map(s=>esc(s.reference||'no reference')+(s.timestamp?', entered '+esc(hdt(s.timestamp)):'')).join('; ')+').'
    +'<label><input type="checkbox" id="rp_dupok" onchange="updateRepayBtn()"> This is a separate payment, not the same one entered twice</label></div>');
  if(p.chargeChanged)w.push('<p class="note">The payment date changes a charge (for example, a late penalty is lower if paid before the deadline). Balance after shows the result.</p>');
  $('#rp_warn').innerHTML=w.join('');
  updateRepayBtn();
}
function updateRepayBtn(){
  const p=RP.preview;
  const okOv=!p||!p.overpayment||($('#rp_ovok')&&$('#rp_ovok').checked);
  const okDup=!p||!(p.similar&&p.similar.length)||($('#rp_dupok')&&$('#rp_dupok').checked);
  $('#rp_btn').disabled=!p||!(p.amount>0)||!p.reconciles||!okOv||!okDup||RP.saving||RP.done;
}
function submitRepay(){
  const p=RP.preview;
  if(RP.saving||RP.done)return;   // one save per form; a second click does nothing
  if(!p||!(p.amount>0))return mst('rp_st','err','Enter the amount received.');
  if(Number($('#rp_am').value)!==p.amount||$('#rp_dt').value!==p.date)return queueRepayPreview();
  RP.saving=true;updateRepayBtn();mst('rp_st','','Saving…');
  const opts={stateKey:p.stateKey,allowOverpayment:!!($('#rp_ovok')&&$('#rp_ovok').checked),confirmDuplicate:!!($('#rp_dupok')&&$('#rp_dupok').checked)};
  Api.recordRepayment(REPAY_LOAN,p.amount,$('#rp_nt').value.trim(),p.date,opts, res=>{
    RP.saving=false;
    if(!res.ok){
      if(res.preview)renderRepayPreview(Object.assign({},res.preview));
      updateRepayBtn();
      return mst('rp_st','err',res.error);
    }
    RP.done=true;updateRepayBtn();
    const a=res.allocation, m=v=>fmt(v);
    mst('rp_st','ok','Recorded'+(res.reference?' as '+res.reference:'')+'. '
      +(a?'Applied: fee '+m(a.fee)+', interest '+m(a.interest)+(a.penalty?', surcharge '+m(a.penalty):'')+', principal '+m(a.principal)+(a.overpaid?', credit '+m(a.overpaid):'')+'. ':'')
      +'Outstanding now: '+fmt(res.loan.outstandingBalance)+'.');
    loadMyAccount();loadAdmin();setTimeout(()=>cm('m_repay'),2500);
  }, e=>{RP.saving=false;updateRepayBtn();mst('rp_st','err','Error: '+e.message);});
}

// ── approve/reject loan requests ──────────────────────────────────────────────
function openApproveLR(id){
  const r=LR_CACHE[id]; if(!r)return;
  APPROV_REQ=r;
  const gl=r.guarantors.map(g=>g.name+' ('+g.memberNo+') - '+g.response).join(', ')||'none';
  $('#alr_info').textContent=r.memberName+' ('+(r.membershipType||'membership type not set')+') requests '+fmt(r.amount)+' over '+r.termLabel+' (total due '+fmt(r.total)+'). Guarantors: '+gl+'.'
    +(r.savingsLimit?' Principal savings: '+fmt(r.savings)+', max: '+fmt(r.maxLoan)+'.':' Soft Loan: no savings cap.')
    +(r.guarantorOverride?' Guarantor restriction override: '+r.guarantorOverride+'.':'');
  $('#alr_ov').value='';mst('alr_st','','');
  if(!r.withinLimit){$('#alr_lim').classList.remove('hidden');$('#alr_ovwrap').classList.remove('hidden');
    $('#alr_lim').textContent=r.limitOverride?'Exceeds the 50% savings limit. Override reason on file from the other approval: '+r.limitOverride+'. You may add your own.':'Exceeds the 50% savings limit. Override reason required.';}
  else{$('#alr_lim').classList.add('hidden');$('#alr_ovwrap').classList.add('hidden');}
  om('m_approveLR');
}
function submitApproveLR(){
  $('#alr_btn').disabled=true;mst('alr_st','','Saving…');
  Api.approveLoanRequest(APPROV_REQ.requestId,$('#alr_ov').value.trim(), res=>{
    $('#alr_btn').disabled=false;
    if(!res.ok){mst('alr_st','err',res.error);if(res.limitCheck)$('#alr_ovwrap').classList.remove('hidden');return;}
    mst('alr_st','ok',res.stage==='final'?'Fully approved. Loan '+res.loanId+' created.':res.message);
    loadLoanReqAdmin();loadAdmin();setTimeout(()=>cm('m_approveLR'),1400);
  }, e=>{$('#alr_btn').disabled=false;mst('alr_st','err','Error: '+e.message);});
}
function openRejectLR(id){REJECT_LR=id;$('#rjlr_rs').value='';mst('rjlr_st','','');om('m_rejectLR');}
function submitRejectLR(){
  const rs=$('#rjlr_rs').value.trim();
  if(!rs)return mst('rjlr_st','err','Enter a reason.');
  $('#rjlr_btn').disabled=true;mst('rjlr_st','','Saving…');
  Api.rejectLoanRequest(REJECT_LR,rs, res=>{
    $('#rjlr_btn').disabled=false;
    if(!res.ok)return mst('rjlr_st','err',res.error);
    mst('rjlr_st','ok','Rejected.');loadLoanReqAdmin();loadAdmin();setTimeout(()=>cm('m_rejectLR'),900);
  }, e=>{$('#rjlr_btn').disabled=false;mst('rjlr_st','err','Error: '+e.message);});
}
